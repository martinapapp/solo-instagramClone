<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="header">
            <img src="images/logo.png" alt="logo-img" class="logo-img">
            <img src="images/user-avatar.png" alt="user-profile-img" class="user-img">
        </div>
        <div class="section">
            <div class="container">
                <img src="images/avatar-vangogh.jpg" alt="followed-profile-img" class="followed-img">
                <div class="followed-info">    
                    <p class="followed-name" id ="followed-name">followed user name</p>
                    <p class="followed-location" id="followed-location">followed location</p>
                </div>
            </div>
            <img src="images/post-vangogh.jpg" alt="followed-shared-img" class="post-img">
            <div class="reaction">
                <img src="images/icon-heart.png" alt="icon-heart" class="icon">
                <img src="images/icon-comment.png" alt="icon-comment" class="icon">
                <img src="images/icon-dm.png" alt="ico-dm" class="icon">
                <p class="num-of-likes" id="num-of-likes">num of likes</p>
                <p class="username" id="username">username <span class="comment" id="comment">comment</span></p>
            </div>
        </div>




        <script src="index.js"></script>
    </body>
</html>
